<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciamento de Tarefas</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="navbar">
      <h1>Gerenciamento de Tarefas</h1>

      <nav>
        <a href="cadastro-usuarios.html">Cadastro de Usuários</a>
        <a href="cadastro-tarefas.html">Cadastro de Tarefas</a>
        <a href="index.html">Gerenciar Tarefas</a>
      </nav>
    </header>

    <main class="conteudo">
      <h2>Cadastro de Usuários</h2>

      <form id="formCadastro">
        <div class="campo">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" required />
        </div>

        <div class="campo">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />
        </div>

        <button type="submit" id="botaoCadastrar">Cadastrar</button>

        <p id="mensagem" role="status"></p>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
