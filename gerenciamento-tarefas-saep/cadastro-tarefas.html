<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Tarefas</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="navbar">
      <h1>Gerenciamento de Tarefas</h1>

      <nav>
        <a href="cadastro-usuarios.html">Cadastro de Usuários</a>
        <a href="cadastro-tarefas.html">Cadastro de Tarefas</a>
        <a href="index.html">Gerenciar Tarefas</a>
      </nav>
    </header>

    <main class="conteudo">
      <h2>Cadastro de Tarefas</h2>

      <form id="formTarefa">
        <div class="campo">
          <label for="descricao">Descrição:</label>
          <input type="text" id="descricao" name="descricao" required />
        </div>

        <div class="campo">
          <label for="setor">Setor:</label>
          <input type="text" id="setor" name="setor" required />
        </div>

        <div class="campo">
          <label for="usuario">Usuário:</label>
          <select id="usuario" name="usuario_id" required>
            <option value="">Selecione um usuário</option>
          </select>
        </div>

        <div class="campo">
          <label for="prioridade">Prioridade:</label>
          <select id="prioridade" name="prioridade" required>
            <option value="">Selecione</option>
            <option value="baixa">Baixa</option>
            <option value="media">Média</option>
            <option value="alta">Alta</option>
          </select>
        </div>

        <button type="submit" id="botaoCadastrar">Cadastrar</button>

        <p id="mensagem" role="status"></p>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
